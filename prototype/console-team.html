<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everypay - Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/tailwind-config.js"></script>
    </head>
<body class="bg-gray-50 flex flex-col h-screen overflow-hidden">
    <main class="flex-1 flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="ep-sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col z-10">
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
                <h1 class="text-xl font-bold text-slate-800">Team Management</h1>
                <div id="ep-header-right"></div>
            </header>

            <div class="flex-1 overflow-y-auto p-8">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Team Management</h2>
                        <p class="text-sm text-gray-500 mt-1">Manage team members and security keys.</p>
                    </div>
                    <button class="px-4 py-2 bg-everypay-600 text-white rounded-lg text-sm font-medium hover:bg-everypay-700 shadow-sm flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add Member
                    </button>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-gray-50 text-gray-500 font-medium border-b border-gray-100">
                                <tr>
                                    <th class="px-6 py-3 w-1/4">Member</th>
                                    <th class="px-6 py-3 w-1/4">Email</th>
                                    <th class="px-6 py-3 w-1/3">Sign Pub Key (Seal X)</th>
                                    <th class="px-6 py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <!-- Member 1: Bound -->
                                <tr class="hover:bg-gray-50">
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-3">
                                            <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 font-bold text-xs">JD</div>
                                            <span class="font-medium text-slate-800">John Doe</span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-gray-600">john@everypay.com</td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-2 text-xs font-mono text-gray-500 bg-gray-50 px-2 py-1 rounded border border-gray-100 w-fit">
                                            <svg class="w-3 h-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                            <span>0x483A...A74FE</span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">Active</span>
                                    </td>
                                </tr>
                                <!-- Member 2: Unbound -->
                                <tr class="hover:bg-gray-50">
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-3">
                                            <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 font-bold text-xs">AS</div>
                                            <span class="font-medium text-slate-800">Alice Smith</span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-gray-600">alice@everypay.com</td>
                                    <td class="px-6 py-4">
                                        <button onclick="connectSealX(this)" class="group flex items-center gap-2 px-3 py-1.5 bg-white border border-gray-300 hover:border-everypay-500 hover:text-everypay-600 text-gray-600 rounded text-xs font-medium transition-all shadow-sm">
                                            <div class="w-4 h-4 rounded-full bg-gray-100 group-hover:bg-everypay-50 flex items-center justify-center transition-colors">
                                                <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                            </div>
                                            Connect Seal X
                                        </button>
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-medium">Pending Key</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script>
function connectSealX(btn) {
    const originalContent = btn.innerHTML;
    btn.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-gray-500 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Connecting...';
    btn.disabled = true;
    setTimeout(() => {
        const parent = btn.parentElement;
        parent.innerHTML = '<div class="flex items-center gap-2 text-xs font-mono text-gray-500 bg-gray-50 px-2 py-1 rounded border border-gray-100 w-fit animate-fadeIn"><svg class="w-3 h-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>0x9B2C...1D4EF</span></div>';
        const statusCell = parent.nextElementSibling;
        statusCell.innerHTML = '<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium animate-fadeIn">Active</span>';
    }, 1500);
}
</script>
    <script src="assets/layout.js"></script>
</body>
</html>
