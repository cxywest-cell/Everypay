<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everypay - Business Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/tailwind-config.js"></script>
</head>
<body class="bg-gray-50 flex flex-col h-screen overflow-hidden">
    <main class="flex-1 flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="ep-sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col z-10"></aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
                <h1 class="text-xl font-bold text-slate-800">Business Operations</h1>
                <div id="ep-header-right"></div>
            </header>

            <div class="flex-1 overflow-hidden p-8 flex flex-col">
                <div class="flex items-end justify-between mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Business Operations</h2>
                        <p class="text-sm text-gray-500 mt-1">Manage business activities, outbound payments, and inbound collections in one workspace.</p>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 shadow-sm flex-1 flex flex-col min-h-0 overflow-hidden">
                    <div class="border-b border-gray-200 px-6 pt-4">
                        <div class="flex items-center gap-6">
                            <button id="tab-activities" onclick="switchOperationsTab('activities')" class="pb-4 px-1 text-sm font-semibold border-b-2 border-everypay-600 text-everypay-600">Activities</button>
                            <button id="tab-payments" onclick="switchOperationsTab('payments')" class="pb-4 px-1 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">Payments</button>
                            <button id="tab-collections" onclick="switchOperationsTab('collections')" class="pb-4 px-1 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">Collections</button>
                        </div>
                    </div>

                    <div class="flex-1 min-h-0 bg-gray-50">
                        <iframe id="operations-frame" title="Business Operations Content" class="w-full h-full border-0 bg-gray-50" src="console-activities.html"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/layout.js"></script>
    <script>
        const operationsPages = {
            activities: 'console-activities.html',
            payments: 'console-payments.html',
            collections: 'console-collection.html'
        };

        function switchOperationsTab(tab) {
            const frame = document.getElementById('operations-frame');
            frame.src = operationsPages[tab];

            Object.keys(operationsPages).forEach(function (key) {
                const button = document.getElementById('tab-' + key);
                const active = key === tab;
                button.className = active
                    ? 'pb-4 px-1 text-sm font-semibold border-b-2 border-everypay-600 text-everypay-600'
                    : 'pb-4 px-1 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300';
            });

            const url = new URL(window.location.href);
            url.searchParams.set('tab', tab);
            window.history.replaceState({}, '', url);
        }

        document.getElementById('operations-frame').addEventListener('load', function () {
            const frame = this;
            try {
                const doc = frame.contentDocument;
                if (!doc || doc.getElementById('operations-embed-style')) return;

                const style = doc.createElement('style');
                style.id = 'operations-embed-style';
                style.textContent = `
                    #ep-sidebar,
                    body > main > div.flex-1.flex.flex-col.overflow-hidden > header {
                        display: none !important;
                    }
                    html, body {
                        height: auto !important;
                        min-height: 100% !important;
                        overflow: auto !important;
                        background: #f9fafb !important;
                    }
                    body > main {
                        height: auto !important;
                        min-height: 100% !important;
                        display: block !important;
                    }
                    body > main > div.flex-1.flex.flex-col.overflow-hidden {
                        display: block !important;
                        height: auto !important;
                        min-height: 100% !important;
                        overflow: visible !important;
                    }
                    body > main > div.flex-1.flex.flex-col.overflow-hidden > div.flex-1 {
                        height: auto !important;
                        overflow: visible !important;
                    }
                `;
                doc.head.appendChild(style);
            } catch (error) {
                console.warn('Unable to apply embedded operations chrome style', error);
            }
        });

        const initialTab = new URLSearchParams(window.location.search).get('tab');
        if (operationsPages[initialTab]) {
            switchOperationsTab(initialTab);
        }
    </script>
</body>
</html>
