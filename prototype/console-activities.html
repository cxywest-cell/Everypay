<body class="bg-gray-50 flex flex-col h-screen overflow-hidden">

                    <!-- Core Info -->

                        <div>

                    </div>

                    <!-- Description -->

                        <label class="block text-xs font-medium text-gray-500 mb-1">Description</label>

                    <!-- Sub-Tabs: Documents / Timeline -->
                    <div>
                        <div class="flex border-b border-gray-200">
                            <button id="detail-tab-docs" onclick="switchDetailTab('docs')" class="flex-1 pb-2 px-1 text-sm font-medium border-b-2 border-everypay-600 text-everypay-600">

    <script>
        // --- Upload Documents Modal ---
        let currentUploadActivityId = '';

        function openUploadDocsModal(activityId) {
            currentUploadActivityId = activityId;
            document.getElementById('upload-docs-modal').classList.remove('hidden');
            document.getElementById('upload-docs-activity-id').textContent = 'Activity: ' + activityId;
            document.getElementById('upload-docs-list').innerHTML = '';
            document.getElementById('upload-docs-input').value = '';
        }

        function closeUploadDocsModal() {
            document.getElementById('upload-docs-modal').classList.add('hidden');
            const drawer = document.getElementById('activity-details-drawer');
            if (!drawer.classList.contains('hidden') && currentUploadActivityId) {
                // Add uploaded docs to the activity's data and timeline
                const data = activitiesData[currentUploadActivityId];
                if (data) {
                    const docList = document.getElementById('upload-docs-list');
                    const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
                    // Find any newly added doc items
                    docList.querySelectorAll('.text-gray-700').forEach(span => {
                        const fileName = span.textContent;
                        if (!data.documents.find(d => d.name === fileName)) {
                            data.documents.push({ name: fileName, uploadedBy: 'you', uploadedAt: now });
                            data.timeline.push({ time: now, type: 'doc', from: 'you', docName: fileName });
                        }
                    });
                    // Refresh the modal content
                    document.getElementById('detail-documents-repo').innerHTML = renderDocumentRepository(data.documents);
                    document.getElementById('drawer-panel-timeline').innerHTML = renderTimeline(data.timeline);
                }
            }
        }

        function uploadActivityDocs(event) {
            const files = event.target.files;
            const docList = document.getElementById('upload-docs-list');
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileId = 'upload-doc-' + Date.now() + '-' + i;
                const item = document.createElement('div');
                item.id = fileId;
                item.className = 'flex items-center justify-between px-3 py-2 bg-gray-50 rounded-md text-sm';
                item.innerHTML = `
                    <div class="flex items-center min-w-0 flex-1">
                        <svg class="w-4 h-4 text-everypay-500 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="text-gray-700 truncate">${file.name}</span>
                    </div>
                    <button type="button" onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 ml-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                docList.appendChild(item);
            }
            event.target.value = '';
        }

        // --- New Activity Modal (Procurement only - users can only propose procurement) ---
        function openNewActivityModal() {
            document.getElementById('new-activity-modal').classList.remove('hidden');
            const typeSelect = document.getElementById('new-activity-type');
            if (typeSelect) {
                typeSelect.value = 'procurement';
                typeSelect.disabled = true;
            }
        }

        function closeNewActivityModal() {
            document.getElementById('new-activity-modal').classList.add('hidden');
            const docList = document.getElementById('activity-documents-list');
            if (docList) docList.innerHTML = '';
            const docInput = document.getElementById('activity-documents-input');
            if (docInput) docInput.value = '';
        }

            const amount = document.getElementById('new-activity-amount').value || '0';
            const desc = document.getElementById('new-activity-desc').value || '';

                documents: [], timeline: [{ time: new Date().toLocaleString(), type: 'status', from: 'you', content: 'Activity proposed' }]
            };

            setTimeout(() => {
                btn.innerHTML = originalText;
                closeNewActivityModal();
                renderActivityTables();
            }, 800);

                status: 'partially_paid',
                proposedBy: 'you',
                counterparty: 'Office Depot Inc.',
                asset: 'USDC ERC20',
                paymentMethod: 'crypto',
                amount: '5,000.00',
                expected: '5,000.00',
                paid: '1,250.00',
                description: 'Office supplies replenishment.',
                documents: [
                    { name: 'po_office_supplies.pdf', type: 'po', uploadedBy: 'you', uploadedAt: '2025-03-28 09:00' },
                    { name: 'partial_receipt.pdf', type: 'receipt', uploadedBy: 'you', uploadedAt: '2025-04-02 11:00' }
                ],
                timeline: [
                    { time: '2025-03-28 09:00', type: 'status', from: 'you', content: 'Activity proposed' },
                    { time: '2025-03-28 09:00', type: 'doc', from: 'you', docName: 'po_office_supplies.pdf' },
                    { time: '2025-03-29 10:00', type: 'status', from: 'counterparty', content: 'Accepted' },
                    { time: '2025-04-02 11:00', type: 'status', from: 'you', content: 'Partially paid — 1,250.00 USDC ERC20' },
                    { time: '2025-04-02 11:00', type: 'doc', from: 'you', docName: 'partial_receipt.pdf' },
                    { time: '2025-04-02 14:00', type: 'message', from: 'counterparty', content: 'Acknowledged. Awaiting balance of 3,750.00.' }
                ]
            }
        };

        // --- Tab Switching ---
        function switchActivityTab(tab) {
            const procTab = document.getElementById('tab-procurement');
            const salesTab = document.getElementById('tab-sales');
            const procPanel = document.getElementById('panel-procurement');
            const salesPanel = document.getElementById('panel-sales');

            if (tab === 'procurement') {
                procTab.className = 'pb-3 px-1 text-sm font-medium border-b-2 border-everypay-600 text-everypay-600';
                salesTab.className = 'pb-3 px-1 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300';
                procPanel.classList.remove('hidden');
                salesPanel.classList.add('hidden');
            } else {
                salesTab.className = 'pb-3 px-1 text-sm font-medium border-b-2 border-everypay-600 text-everypay-600';
                procTab.className = 'pb-3 px-1 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300';
                salesPanel.classList.remove('hidden');
                procPanel.classList.add('hidden');
            }
        }

        // --- Dynamic Table Rendering ---
        function renderActivityTables() {
            const procurementTbody = document.getElementById('procurement-tbody');
            const salesTbody = document.getElementById('sales-tbody');

            procurementTbody.innerHTML = '';
            salesTbody.innerHTML = '';

            Object.values(activitiesData).forEach(data => {
                const paidReceived = data.type === 'Procurement' ? data.paid : data.received;
                const expected = parseFloat(data.expected.replace(/,/g, ''));
                const paid = parseFloat(paidReceived.replace(/,/g, ''));
                const pct = expected > 0 ? (paid / expected * 100) : 0;
                const pctStr = isNaN(pct) ? '0' : Math.round(pct);
                const barColor = pct === 0 ? 'bg-gray-300' : pct >= 100 ? 'bg-green-500' : 'bg-everypay-500';
                const paidLabel = data.type === 'Procurement' ? 'Paid' : 'Received';

                // Single status badge with color
                const statusColors = {
                    'proposed': 'bg-amber-50 text-amber-700 ring-amber-600/20',
                    'unpaid': 'bg-red-50 text-red-700 ring-red-600/10',
                    'partially_paid': 'bg-blue-50 text-blue-700 ring-blue-600/10',
                    'paid': 'bg-green-50 text-green-700 ring-green-600/20',
                    'overpaid': 'bg-purple-50 text-purple-700 ring-purple-600/20'
                };
                const colorClass = statusColors[data.status] || 'bg-gray-50 text-gray-700 ring-gray-500/10';

                const statusCell = `
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium ring-1 ring-inset w-fit ${colorClass}">${data.status.charAt(0).toUpperCase() + data.status.slice(1)}</span>
                    </td>
                `;

                const row = `
                    <tr class="hover:bg-gray-50 cursor-pointer" onclick="openActivityDetails('${data.id}')">
                        <td class="px-6 py-4 font-mono text-xs text-gray-500">${data.id}</td>
                        <td class="px-6 py-4">
                            <span class="font-medium text-slate-700">${data.counterparty}</span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-1">
                                <span class="font-medium text-slate-700">${data.asset.split(' ')[0]}</span>
                                <span class="text-[10px] text-gray-500 bg-gray-100 px-1 rounded">${data.asset.split(' ')[1]}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex flex-col gap-1">
                                <div class="flex items-baseline justify-between">
                                    <span class="text-[10px] text-gray-400">Expected</span>
                                    <span class="font-medium text-slate-800">${data.expected}</span>
                                </div>
                                <div class="flex items-baseline justify-between">
                                    <span class="text-[10px] text-gray-400">${paidLabel}</span>
                                    <span class="font-medium ${paid > 0 ? 'text-green-600' : 'text-gray-400'}">${paidReceived}</span>
                                </div>
                                <div class="w-full bg-gray-100 rounded-full h-1.5">
                                    <div class="${barColor} h-1.5 rounded-full" style="width: ${pctStr}%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            ${data.paymentMethod === 'fiat' 
                                ? '<span class="inline-flex items-center gap-1 text-xs font-medium text-gray-600"><svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>Fiat</span>'
                                : '<span class="inline-flex items-center gap-1 text-xs font-medium text-gray-600"><svg class="w-3.5 h-3.5 text-everypay-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>Crypto</span>'}
                        </td>
                        ${statusCell}
                        <td class="px-4 py-4">
                            <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </td>
                    </tr>
                `;

                if (data.type === 'Procurement') {
                    procurementTbody.innerHTML += row;
                } else if (data.type === 'Sales') {
                    salesTbody.innerHTML += row;
                }
            });
        }

        // --- Activity Details Modal Logic ---

        // Render timeline events        // Render timeline events
        function renderTimeline(timeline) {
            if (!timeline || timeline.length === 0) {
                return '<p class="text-sm text-gray-400 text-center py-4">No activity yet</p>';
            }

            return timeline.map((evt, i) => {
                const isLast = i === timeline.length - 1;
                const fromLabel = evt.from === 'you' ? 'You' : evt.from === 'counterparty' ? 'Counterparty' : evt.from;

                let colors = { dot: 'bg-gray-400', ring: 'ring-gray-400' };
                let icon = '';
                let contentHtml = '';

                if (evt.type === 'status') {
                    colors = { dot: 'bg-green-400', ring: 'ring-green-400' };
                    icon = '<span class="inline-flex items-center rounded-full bg-green-50 px-1.5 py-0.5 text-[10px] font-medium text-green-700 ring-1 ring-inset ring-green-600/20">Status</span>';
                    contentHtml = '<span class="text-sm text-gray-700">' + evt.content + '</span>';
                } else if (evt.type === 'doc') {
                    colors = { dot: 'bg-blue-400', ring: 'ring-blue-400' };
                    icon = '<span class="inline-flex items-center rounded-full bg-blue-50 px-1.5 py-0.5 text-[10px] font-medium text-blue-700 ring-1 ring-inset ring-blue-600/20">Document</span>';
                    contentHtml = '<span class="text-sm text-gray-700">Uploaded <span class="font-medium">' + evt.docName + '</span></span>';
                } else if (evt.type === 'message') {
                    colors = { dot: 'bg-gray-400', ring: 'ring-gray-400' };
                    icon = '<span class="inline-flex items-center rounded-full bg-gray-50 px-1.5 py-0.5 text-[10px] font-medium text-gray-600 ring-1 ring-inset ring-gray-500/10">Note</span>';
                    contentHtml = '<div class="mt-1 text-sm text-gray-600 bg-gray-50 rounded-md px-3 py-2">' + evt.content + '</div>';
                }

                return (
                    '<div class="relative flex gap-3">' +
                        '<div class="flex flex-col items-center">' +
                            '<div class="w-2.5 h-2.5 rounded-full ' + colors.dot + ' ring-4 ring-white"></div>' +
                            (!isLast ? '<div class="w-0.5 flex-1 bg-gray-200"></div>' : '') +
                        '</div>' +
                        '<div class="flex-1 pb-4">' +
                            '<div class="flex items-center gap-2 mb-0.5">' +
                                '<span class="text-xs text-gray-400 tabular-nums whitespace-nowrap">' + evt.time + '</span>' +
                                icon +
                                '<span class="text-xs text-gray-500">' + fromLabel + '</span>' +
                            '</div>' +
                            contentHtml +
                        '</div>' +
                    '</div>'
                );
            }).join('');
        }

        // Render document repository
        function renderDocumentRepository(documents) {
            if (!documents || documents.length === 0) {
                return '<p class="text-sm text-gray-400 text-center py-4">No documents uploaded yet</p>';
            }

            return documents.map(doc => {
                const uploaderLabel = doc.uploadedBy === 'you' ? 'You' : 'Counterparty';
                const uploaderColor = doc.uploadedBy === 'you' ? 'text-everypay-600' : 'text-gray-500';
                return (
                    '<li class="flex items-center justify-between py-2.5 px-3 bg-gray-50 rounded-md border border-gray-200">' +
                        '<div class="flex items-center gap-2 min-w-0">' +
                            '<svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>' +
                            '<div class="min-w-0">' +
                                '<span class="text-xs font-medium text-gray-700 truncate block">' + doc.name + '</span>' +
                                '<span class="text-[10px] ' + uploaderColor + '">' + uploaderLabel + '</span>' +
                                '<span class="text-[10px] text-gray-300"> &middot; ' + doc.uploadedAt + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<a href="#" class="text-xs text-everypay-600 hover:text-everypay-800 font-medium flex-shrink-0">View</a>' +
                    '</li>'
                );
            }).join('');
        }

        function openActivityDetails(id) {
            const data = activitiesData[id];
            if (!data) return;

            document.getElementById('detail-id').textContent = data.id;

            // Type badge
            const typeBadge = document.getElementById('detail-type');
            typeBadge.textContent = data.type;
            if (data.type === 'Procurement') {
                typeBadge.className = 'inline-flex items-center rounded-md bg-red-50 px-2 py-1 text-xs font-medium text-red-700 ring-1 ring-inset ring-red-600/10';
            } else {
                typeBadge.className = 'inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20';
            }

            // Single status badge
            const statusBadge = document.getElementById('detail-agreement');
            const statusDisplay = data.status.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            statusBadge.textContent = statusDisplay;
            const statusColors = {
                'proposed': 'bg-amber-50 text-amber-700 ring-amber-600/20',
                'accepted': 'bg-blue-50 text-blue-700 ring-blue-600/10',
                'unpaid': 'bg-red-50 text-red-700 ring-red-600/10',
                'partially_paid': 'bg-blue-50 text-blue-700 ring-blue-600/10',
                'paid': 'bg-green-50 text-green-700 ring-green-600/20',
                'overpaid': 'bg-purple-50 text-purple-700 ring-purple-600/20',
                'rejected': 'bg-gray-100 text-gray-500 ring-gray-400/10'
            };
            statusBadge.className = 'inline-flex items-center rounded-md px-2 py-1 text-xs font-medium ring-1 ring-inset ' + (statusColors[data.status] || 'bg-gray-50 text-gray-700 ring-gray-500/10');

            document.getElementById('detail-counterparty').textContent = data.counterparty;
            document.getElementById('detail-amount').textContent = data.expected;
            const [token, network] = data.asset.split(' ');
            document.getElementById('detail-asset').innerHTML = token + ' <span class="text-[10px] text-gray-500 bg-gray-100 px-1 rounded ml-1">' + network + '</span>';
            document.getElementById('detail-description').textContent = data.description;

            // Payment method
            const pmIcon = document.getElementById('detail-payment-icon');
            const pmLabel = document.getElementById('detail-payment-label');
            if (data.paymentMethod === 'fiat') {
                pmIcon.innerHTML = '<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>';
                pmLabel.textContent = 'Fiat';
            } else {
                pmIcon.innerHTML = '<svg class="w-4 h-4 text-everypay-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>';
                pmLabel.textContent = 'Crypto';
            }

            // Render Timeline
            document.getElementById('drawer-panel-timeline').innerHTML = renderTimeline(data.timeline);

            // Render Document Repository
            document.getElementById('detail-documents-repo').innerHTML = renderDocumentRepository(data.documents);

            // Default to Timeline tab
            switchDetailTab('timeline');

            // Accept/Reject - show only when status is 'proposed' and proposed by counterparty
            const actionsWrapper = document.getElementById('detail-actions-wrapper');
            if (data.status === 'proposed' && data.proposedBy === 'counterparty') {
                actionsWrapper.classList.remove('hidden');
            } else {
                actionsWrapper.classList.add('hidden');
            }

            document.getElementById('activity-details-drawer').classList.remove('hidden');
        }

        // --- Detail Sub-Tabs ---
        function switchDetailTab(tab) {
            const docsTab = document.getElementById('detail-tab-docs');
            const timelineTab = document.getElementById('detail-tab-timeline');
            const docsPanel = document.getElementById('detail-panel-docs');
            const timelinePanel = document.getElementById('detail-panel-timeline');

            if (tab === 'docs') {
                docsTab.className = 'flex-1 pb-2 px-1 text-sm font-medium border-b-2 border-everypay-600 text-everypay-600';
                timelineTab.className = 'flex-1 pb-2 px-1 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300';
                docsPanel.classList.remove('hidden');
                timelinePanel.classList.add('hidden');
            } else {
                timelineTab.className = 'flex-1 pb-2 px-1 text-sm font-medium border-b-2 border-everypay-600 text-everypay-600';
                docsTab.className = 'flex-1 pb-2 px-1 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300';
                timelinePanel.classList.remove('hidden');
                docsPanel.classList.add('hidden');
            }
        }

        function closeActivityDetails() {
            document.getElementById('activity-details-drawer').classList.add('hidden');
        }

        function acceptActivity() {
            const activityId = document.getElementById('detail-id').textContent;
            const data = activitiesData[activityId];
            if (data) {
                const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
                data.status = 'accepted';
                data.proposedBy = 'you';
                data.timeline.push({ time: now, type: 'status', from: 'you', content: 'Accepted' });
                openActivityDetails(activityId);
                renderActivityTables();
            }
        }

        function rejectActivity() {
            const activityId = document.getElementById('detail-id').textContent;
            const data = activitiesData[activityId];
            if (data) {
                const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
                data.status = 'rejected';
                data.timeline.push({ time: now, type: 'status', from: 'you', content: 'Rejected' });
                closeActivityDetails();
                renderActivityTables();
            }
        }

        function postTimelineMessage() {
            const input = document.getElementById('timeline-message-input');
            const text = input.value.trim();
            if (!text) return;

            const activityId = document.getElementById('detail-id').textContent;
            const data = activitiesData[activityId];
            if (!data) return;

            const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
            data.timeline.push({ time: now, type: 'message', from: 'you', content: text });
            input.value = '';

            // Re-render timeline and switch to timeline tab
            document.getElementById('drawer-panel-timeline').innerHTML = renderTimeline(data.timeline);
            switchDetailTab('timeline');
        }

        function openUploadFromDrawer() {
            const activityId = document.getElementById('detail-id').textContent;
            openUploadDocsModal(activityId);
        }

        // Initialize tables on load
        renderActivityTables();
    </script>
    <script src="assets/layout.js"></script>
    <script>
        // Auto-open activity detail from URL parameter (e.g. from Payments page)
        (function() {
            const params = new URLSearchParams(window.location.search);
            const openId = params.get('open');
            if (openId && activitiesData[openId]) {
                setTimeout(function() { openActivityDetails(openId); }, 300);
            }
        })();
    </script>
</body>
</html>
